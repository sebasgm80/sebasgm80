<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habitación 3D</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// Room units: 1 unit ~ 0.5 m. Back corner at origin; wall A = plane x=0 (screen-left),
// wall B = plane z=0 (screen-right). Floor spans x,z in [0,10]. Height 3.2.
const W = 10, H = 3.2;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setClearColor(0xffffff, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// Orthographic isometric camera looking at the room from the front corner.
const frustum = 7.4;
const camera = new THREE.OrthographicCamera(-frustum, frustum, frustum, -frustum, -100, 200);
camera.position.set(30, 30, 30);
camera.lookAt(W / 2, 1.2, W / 2);

function fit() {
  const a = innerWidth / innerHeight;
  camera.left = -frustum * a; camera.right = frustum * a;
  camera.top = frustum; camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fit); fit();

// Lights: warm-cool key + ambient, dim like the reference (night, rain).
scene.add(new THREE.HemisphereLight(0xb8c8dc, 0x2a3040, 1.6));
const key = new THREE.DirectionalLight(0xdfe8f5, 1.1);
key.position.set(-8, 16, 10);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
scene.add(key);
const monitorGlow = new THREE.PointLight(0x66ff66, 1.2, 4, 2);
scene.add(monitorGlow);

// Materials (palette sampled from the reference).
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, ...o });
const mat = {
  wall:   M(0x4c6259),
  wallDk: M(0x3a4c46),
  trim:   M(0x1a2220),
  floor:  M(0x2e3a4e),
  floorDk:M(0x232d3e),
  rug:    M(0x6d3b2b),
  rugTrim:M(0x9a8a6e),
  wood:   M(0x6e4226),
  woodDk: M(0x4a2b19),
  metal:  M(0x7d8790, { metalness: 0.4, roughness: 0.6 }),
  metalDk:M(0x4b545c, { metalness: 0.4, roughness: 0.7 }),
  door:   M(0x7b8590, { metalness: 0.3, roughness: 0.7 }),
  sheet:  M(0x80858c),
  pillow: M(0xb8c2c8),
  cardb:  M(0x8a5230),
  cardDk: M(0x6a3e22),
  sofa:   M(0x4f6a5e),
  sofaDk: M(0x3b5248),
  fridge: M(0xb4c0c6, { metalness: 0.3, roughness: 0.5 }),
  rad:    M(0xe4e8ea, { roughness: 0.5 }),
  beige:  M(0xc9ccd0, { roughness: 0.6 }),
  glass:  M(0x20324a, { roughness: 0.2, metalness: 0.2, emissive: 0x0a1424, emissiveIntensity: 1 }),
  mirror: M(0xa9c0cc, { roughness: 0.05, metalness: 0.8 }),
  crt:    M(0x9fb89a),
  screen: new THREE.MeshStandardMaterial({ color: 0x0a1a0a, emissive: 0x33ff55, emissiveIntensity: 0.9 }),
  pic:    M(0x5a6b74),
};

function box(w, h, d, material, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ---- Room shell -----------------------------------------------------------
// Floor: tiled, with a few dark stains.
const floor = new THREE.Group();
const T = 1.25; // tile size
for (let i = 0; i < W / T; i++) for (let j = 0; j < W / T; j++) {
  const dark = (i + j) % 2 === 0;
  const t = box(T - 0.04, 0.12, T - 0.04, dark ? mat.floor : mat.floorDk, (i + 0.5) * T, -0.12, (j + 0.5) * T, floor);
  t.castShadow = false;
}
scene.add(floor);
[[1.5, 6.2, 1.2], [6.5, 9.0, 1.0], [4.2, 3.2, 1.6], [8.2, 4.7, 0.9]].forEach(([x, z, r]) => {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.1, 0.02, 10), mat.trim);
  s.rotation.x = 0; s.position.set(x, 0.005, z); scene.add(s);
});

// Walls (thickness 0.25) and trim.
box(0.25, H, W, mat.wall, -0.125, 0, W / 2);  // wall A (screen-left), x = 0 face
box(W, H, 0.25, mat.wall, W / 2, 0, -0.125);  // wall B (screen-right), z = 0 face
box(0.06, 0.25, W, mat.trim, 0.03, 0, W / 2); // baseboards
box(W, 0.25, 0.06, mat.trim, W / 2, 0, 0.03);

// ---- Wall A (x = 0): door, mirror, locker, picture --------------------------
// Door near the left corner.
box(0.12, 3.2, 1.6, mat.door, 0.0, 0, 8.4);
box(0.06, 0.3, 0.3, mat.metalDk, 0.08, 1.6, 7.8); // light switch / handle plate
// Mirror, leaning against wall.
box(0.1, 2.6, 1.2, mat.wood, 0.1, 0.1, 6.2);
box(0.05, 2.3, 0.95, mat.mirror, 0.16, 0.25, 6.2);
// Metal locker.
box(0.9, 2.5, 1.1, mat.metal, 0.1, 0, 4.0);
box(0.05, 2.0, 0.1, mat.metalDk, 1.0, 0.25, 4.45);
// Framed picture.
box(0.08, 0.7, 0.9, mat.wood, 0.0, 2.0, 2.2);
box(0.1, 0.5, 0.7, mat.pic, 0.0, 2.1, 2.2);

// ---- Wall B (z = 0): bed, desk, chair, window, radiator, fridge, cabinet ----
// Bed frame (pallet) + mattress + pillow; head against wall.
box(3.3, 0.45, 2.0, mat.woodDk, 1.0, 0, 0.2);
box(3.1, 0.35, 1.85, mat.sheet, 1.1, 0.45, 0.25);
box(0.9, 0.2, 1.1, mat.pillow, 1.3, 0.8, 0.45);
// Nightstand.
box(0.9, 0.9, 0.8, mat.wood, 4.4, 0, 0.45);
// Desk.
box(2.6, 0.1, 1.1, mat.wood, 5.8, 1.45, 0.6);
[[4.95, 0.05], [6.6, 0.05], [4.95, 1.05], [6.6, 1.05]].forEach(([x, z]) => box(0.12, 1.45, 0.12, mat.woodDk, x, 0, z));
// Computer: CRT box, screen, keyboard, mouse.
box(1.0, 0.9, 0.9, mat.crt, 5.4, 1.55, 0.35);
box(0.82, 0.62, 0.05, mat.screen, 5.4, 1.75, -0.05);
box(0.85, 0.08, 0.3, mat.beige, 5.5, 1.55, 1.0);
box(0.12, 0.05, 0.18, mat.beige, 6.1, 1.55, 1.0);
// Chair.
box(0.7, 0.1, 0.7, mat.wood, 5.2, 0.85, 1.9);
box(0.7, 1.1, 0.08, mat.wood, 5.2, 0.85, 1.6);
[[4.9, 1.6], [5.5, 1.6], [4.9, 2.2], [5.5, 2.2]].forEach(([x, z]) => box(0.08, 0.85, 0.08, mat.woodDk, x, 0, z));
// Window with rain (dark glass) and sill.
box(2.0, 1.4, 0.06, mat.glass, 8.0, 1.5, 0.04);
box(2.1, 0.08, 0.3, mat.metal, 8.0, 1.4, 0.12);
box(0.05, 1.4, 0.05, mat.metalDk, 8.0, 1.5, 0.06);
// Radiator under window.
for (let i = 0; i < 6; i++) box(0.1, 0.9, 0.22, mat.rad, 7.05 + i * 0.1, 0.1, 0.25);
// Cardboard boxes stacked.
box(1.1, 0.9, 0.9, mat.cardb, 8.9, 0, 0.7);
box(1.0, 0.8, 0.8, mat.cardDk, 8.95, 0.9, 0.7);
// Stove cabinet with two burners.
box(1.4, 1.0, 1.0, mat.beige, 8.6, 0, 2.6);
box(1.3, 0.1, 0.9, mat.metalDk, 8.6, 1.0, 2.6);
[[8.25, 2.25], [8.95, 2.95]].forEach(([x, z]) => {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.08, 16), mat.metal);
  c.position.set(x, 1.12, z); c.castShadow = true; scene.add(c);
});
// Fridge in the corner.
box(1.0, 2.5, 1.2, mat.fridge, 9.1, 0, 0.8);
box(0.05, 0.6, 0.05, mat.metalDk, 9.6, 1.4, 0.15);

// ---- Centre: rug, sofa, coffee table ------------------------------------------
const rug = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.03, 3.1), mat.rug);
rug.position.set(4.2, 0.03, 6.0); rug.rotation.y = Math.PI / 4; rug.receiveShadow = true; scene.add(rug);
const rugTrim = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.035, 2.7), mat.rugTrim);
rugTrim.position.set(4.2, 0.035, 6.0); rugTrim.rotation.y = Math.PI / 4; scene.add(rugTrim);
// Sofa (seat + back + arms), back toward the fridge.
box(2.6, 0.45, 1.1, mat.sofa, 8.5, 0, 6.0);
box(2.6, 0.9, 0.3, mat.sofaDk, 8.5, 0.45, 5.45);
box(0.25, 0.7, 1.4, mat.sofaDk, 9.4, 0, 5.8);
box(0.25, 0.7, 1.4, mat.sofaDk, 7.6, 0, 5.8);
// Coffee table.
box(1.2, 0.5, 0.7, mat.wood, 6.0, 0.3, 7.6);
[[5.5, 7.3], [6.5, 7.3], [5.5, 7.9], [6.5, 7.9]].forEach(([x, z]) => box(0.08, 0.3, 0.08, mat.woodDk, x, 0, z));

// ---- Lighting cues ------------------------------------------------------------
monitorGlow.position.set(5.4, 1.9, 0.6);

// ---- Idle orbit (slow) so the model reads as 3D; drag to orbit ------------------
let orbit = 0, drag = null;
const target = new THREE.Vector3(W / 2, 1.2, W / 2);
addEventListener('pointerdown', e => drag = e.clientX);
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (drag !== null) { orbit += (e.clientX - drag) * 0.005; drag = e.clientX; } });

const params = new URLSearchParams(location.search);
const fixed = params.has('fixed');
if (fixed) orbit = 0;

function placeCamera() {
  const r = 42, a = Math.PI / 4 + orbit;
  camera.position.set(target.x + Math.cos(a) * r, 30, target.z + Math.sin(a) * r);
  camera.lookAt(target);
}

renderer.setAnimationLoop(() => {
  if (!fixed && drag === null) orbit += 0.002;
  placeCamera();
  renderer.render(scene, camera);
});
window.__ready = true;
</script>
</body>
</html>
