<meta charset="utf-8">
<title>Habitación 3D</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;left:12px;bottom:10px;font:12px system-ui,sans-serif;color:#556;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:4px;pointer-events:none}
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---- Calibration: reference pixel = f(world). Image is 2000 x 1321 px. ----
// The room is projected onto the reference image so, from the reference
// viewpoint, every surface shows the exact pixels of the picture.
const IMG_W = 2000, IMG_H = 1321;
const CAL = { kx: 94.2, bx: 1000, ky: 47.5, by: 365, kh: 128 };
const DEPTH = 40;

function toPx(x, y, z) {
  return [CAL.kx * (x - z) + CAL.bx, CAL.by + CAL.ky * (x + z) - CAL.kh * y];
}

const texture = new THREE.TextureLoader().load('./reference.jpg');
texture.colorSpace = THREE.SRGBColorSpace;
const calco = new THREE.MeshBasicMaterial({ map: texture });

// Projection matrix that maps world -> reference pixels -> clip space.
const P = new THREE.Matrix4().set(
  2 * CAL.kx / IMG_W, 0, -2 * CAL.kx / IMG_W, 2 * CAL.bx / IMG_W - 1,
  -2 * CAL.ky / IMG_H, 2 * CAL.kh / IMG_H, -2 * CAL.ky / IMG_H, 1 - 2 * CAL.by / IMG_H,
  -1 / DEPTH, -1 / DEPTH, -1 / DEPTH, 0,
  0, 0, 0, 1);
const refCam = new THREE.Camera();
refCam.projectionMatrix.copy(P);
refCam.projectionMatrixInverse.copy(P).invert();

// Reference view: the picture itself, drawn full-frame.
const picScene = new THREE.Scene();
const picCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const picMat = new THREE.MeshBasicMaterial({ map: texture, depthTest: false, depthWrite: false });
picScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), picMat));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xffffff, 1);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Bake the mesh's transform into its geometry and set UVs from the reference
// projection, so the picture lands on the surface where it appears in the image.
function bake(mesh) {
  mesh.updateMatrixWorld(true);
  const g = mesh.geometry.clone().applyMatrix4(mesh.matrixWorld);
  mesh.geometry = g;
  mesh.position.set(0, 0, 0); mesh.rotation.set(0, 0, 0); mesh.scale.set(1, 1, 1);
  mesh.updateMatrixWorld(true);
  const pos = g.attributes.position;
  const uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    const [px, py] = toPx(pos.getX(i), pos.getY(i), pos.getZ(i));
    uv[i * 2] = px / IMG_W;
    uv[i * 2 + 1] = 1 - py / IMG_H;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return mesh;
}

function add(geo, x, y, z, parent = scene) {
  const m = new THREE.Mesh(geo, calco);
  m.position.set(x, y, z);
  parent.add(bake(m));
  return m;
}
// Box with x, z at its centre and y at its bottom.
function box(w, h, d, x, y, z, parent) {
  return add(new THREE.BoxGeometry(w, h, d), x, y + h / 2, z, parent);
}
function cyl(r, h, x, y, z) {
  return add(new THREE.CylinderGeometry(r, r, h, 16), x, y + h / 2, z);
}

// ---- Floor (tiles, stains) and walls -------------------------------------
const W = 10, H = 3.2, T = 1.25;
for (let i = 0; i < W / T; i++) for (let j = 0; j < W / T; j++) {
  box(T - 0.04, 0.12, T - 0.04, (i + 0.5) * T, -0.12, (j + 0.5) * T);
}
[[1.5, 6.2, 1.2], [6.5, 9.0, 1.0], [4.2, 3.2, 1.6], [8.2, 4.7, 0.9]]
  .forEach(([x, z, r]) => cyl(r, 0.02, x, 0.0, z));
box(0.25, H, W, -0.125, 0, W / 2);  // wall A (left in the picture), x = 0
box(W, H, 0.25, W / 2, 0, -0.125);  // wall B (right in the picture), z = 0

// ---- Wall A: door, mirror, locker, picture ----------------------------------
box(0.12, 3.2, 1.6, 0.0, 0, 8.4);
box(0.1, 2.6, 1.2, 0.1, 0.1, 6.2);
box(0.9, 2.5, 1.1, 0.1, 0, 4.0);
box(0.08, 0.7, 0.9, 0.0, 2.0, 2.2);

// ---- Wall B: bed, desk, computer, chair, window, radiator, boxes, stove, fridge
box(3.3, 0.45, 2.0, 1.0, 0, 0.2);
box(3.1, 0.35, 1.85, 1.1, 0.45, 0.25);
box(0.9, 0.2, 1.1, 1.3, 0.8, 0.45);
box(0.9, 0.9, 0.8, 4.4, 0, 0.45);
box(2.6, 0.1, 1.1, 5.8, 1.45, 0.6);
[[4.95, 0.05], [6.6, 0.05], [4.95, 1.05], [6.6, 1.05]].forEach(([x, z]) => box(0.12, 1.45, 0.12, x, 0, z));
box(1.0, 0.9, 0.9, 5.4, 1.55, 0.35);
box(0.82, 0.62, 0.05, 5.4, 1.75, 0.05);
box(0.85, 0.08, 0.3, 5.5, 1.55, 1.0);
box(0.7, 0.1, 0.7, 5.2, 0.85, 1.9);
box(0.7, 1.1, 0.08, 5.2, 0.85, 1.6);
box(2.0, 1.4, 0.06, 8.0, 1.5, 0.04);
box(2.1, 0.08, 0.3, 8.0, 1.4, 0.12);
for (let i = 0; i < 6; i++) box(0.1, 0.9, 0.22, 7.05 + i * 0.1, 0.1, 0.25);
box(1.1, 0.9, 0.9, 8.9, 0, 0.7);
box(1.0, 0.8, 0.8, 8.95, 0.9, 0.7);
box(1.4, 1.0, 1.0, 8.6, 0, 2.6);
box(1.3, 0.1, 0.9, 8.6, 1.0, 2.6);
box(1.0, 2.5, 1.2, 9.1, 0, 0.8);

// ---- Centre: rug, sofa, coffee table --------------------------------------
add(new THREE.BoxGeometry(4.6, 0.03, 3.1), 4.2, 0.03, 6.0);
box(2.6, 0.45, 1.1, 8.5, 0, 6.0);
box(2.6, 0.9, 0.3, 8.5, 0.45, 5.45);
box(0.25, 0.7, 1.4, 9.4, 0, 5.8);
box(0.25, 0.7, 1.4, 7.6, 0, 5.8);
box(1.2, 0.5, 0.7, 6.0, 0.3, 7.6);

// ---- Views ---------------------------------------------------------------
// Reference view: the calibrated projection, so the picture matches exactly.
// Drag to orbit an ordinary isometric camera (the picture then stretches over
// the geometry). Double-click returns to the reference view.
let mode = 'ref', orbit = Math.PI / 4, dragX = null, moved = 0;
const target = new THREE.Vector3(W / 2, 1.2, W / 2);
const orbitCam = new THREE.OrthographicCamera(-8, 8, 8, -8, -100, 200);

function fitOrbit() {
  const a = innerWidth / innerHeight;
  orbitCam.left = -8 * a; orbitCam.right = 8 * a;
  orbitCam.top = 8; orbitCam.bottom = -8;
  orbitCam.updateProjectionMatrix();
}

function placeOrbit() {
  orbitCam.position.set(target.x + Math.cos(orbit) * 42, 30, target.z + Math.sin(orbit) * 42);
  orbitCam.lookAt(target);
}

addEventListener('pointerdown', e => { dragX = e.clientX; moved = 0; });
addEventListener('pointerup', () => { dragX = null; });
addEventListener('pointermove', e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX;
  moved += Math.abs(dx);
  if (moved > 4) { mode = 'orbit'; orbit += dx * 0.005; dragX = e.clientX; }
});
addEventListener('dblclick', () => { mode = 'ref'; });
addEventListener('resize', () => { fitOrbit(); });
fitOrbit();

function frame() {
  const cw = innerWidth, ch = innerHeight;
  renderer.setSize(cw, ch);
  renderer.setScissor(0, 0, cw, ch);
  renderer.setViewport(0, 0, cw, ch);
  if (mode === 'ref') {
    // Letterbox the reference picture inside the window and show it exactly.
    const s = Math.min(cw / IMG_W, ch / IMG_H);
    const w = s * IMG_W, h = s * IMG_H;
    const x0 = (cw - w) / 2, y0 = (ch - h) / 2;
    renderer.setViewport(x0, y0, w, h);
    renderer.setScissor(x0, y0, w, h);
    renderer.setClearColor(0xffffff, 1);
    renderer.render(picScene, picCam);
  } else {
    placeOrbit();
    renderer.setClearColor(0xffffff, 1);
    renderer.render(scene, orbitCam);
  }
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script>
